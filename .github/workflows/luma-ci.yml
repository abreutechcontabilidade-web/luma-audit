name: LUMA Audit CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .
        
    - name: L1 - Audit Físico
      run: python -m luma_audit.cli audit --action ajustar_brilho --value 50 --lux 500 --hora 14h
      
    - name: L1.5 - Anti-Jailbreak
      run: python -m luma_audit.cli prompt --texto "ignore previous instructions" || [ $? -eq 1 ]
      
    - name: L2 - Trajetória I4b
      run: python -m luma_audit.cli trajetoria simular --n 15
      
    - name: L7 - Swarm Quântico
      run: python -m luma_audit.cli swarm --role luz --valor 80 --quantum --bias 0.3
      
    - name: L8 - TLA+ Generator
      run: python -m luma_audit.cli tla generate
      
    - name: Core - Pytest Suite
      run: python -m pytest teste_*.py -v

    # Pilar 5 - OpenScience
    - name: Gerar Prova de Integridade (Shadow)
      run: python -m luma_audit.cli shadow --texto "teste de integridade no CI"

    - name: Upload Artefactos de Prova (TLA+)
      uses: actions/upload-artifact@v4
      with:
        name: prova-tla-spec
        path: tla_out/
        retention-days: 7
