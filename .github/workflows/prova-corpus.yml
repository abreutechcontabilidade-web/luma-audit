name: Prova Corpus

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
      - name: Instalar luma-audit
        run: pip install luma-audit
      - name: Correr validacao
        run: python scripts/validar_corpus.py --n 500
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: relatorio-corpus
          path: corpus/RELATORIO.md
