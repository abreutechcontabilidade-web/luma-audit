name: LUMA OpenScience (Prova Publica)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pinned SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python (pinned SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Instalar pacote
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Suite de testes
        run: python -m pytest teste_*.py -q

      - name: Gerar especificacao TLA+
        run: python -m luma_audit.cli tla generate --out-dir tla_out

      - name: Upload artefactos TLA+
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prova-tla-spec
          path: tla_out/
          retention-days: 7

      - name: Prova de integridade (shadow local - audita, nao bloqueia)
        run: python -m luma_audit.cli shadow --texto "teste de integridade no CI"

      - name: Resumo da prova (proof.json)
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os

          def sha256_ficheiro(caminho):
              with open(caminho, "rb") as f:
                  return hashlib.sha256(f.read()).hexdigest()

          prova = {
              "data_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "git_sha": os.environ.get("GITHUB_SHA", "?"),
              "CommitKernel.tla": sha256_ficheiro("tla_out/CommitKernel.tla"),
              "CommitKernel.cfg": sha256_ficheiro("tla_out/CommitKernel.cfg"),
              "modo": "auditoria passiva (shadow) - CI sem DATABASE_URL, prova local",
          }
          with open("proof.json", "w", encoding="utf-8") as f:
              json.dump(prova, f, indent=2)
          print(json.dumps(prova, indent=2))
          PY

      - name: Upload prova de integridade
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prova-integridade-json
          path: proof.json
          retention-days: 7