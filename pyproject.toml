[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-audit"
version = "0.9.2"
description = "Deterministic governance for AI actions."
requires-python = ">=3.9"
dependencies = [
    "psycopg2-binary>=2.9.9"
]

[project.scripts]
luma = "luma_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]