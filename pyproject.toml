[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-audit"
version = "0.5.0"
description = "Deterministic governance for AI actions. No LLM in the decision path."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alesson Abreu", email = "abreu.tech.contabilidade@gmail.com"}]
keywords = ["ai-safety", "guardrails", "execution-control", "deterministic", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/abreutechcontabilidade-web/luma-audit"
Issues = "https://github.com/abreutechcontabilidade-web/luma-audit/issues"

[project.scripts]
luma = "luma_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = "teste_*.py"
python_functions = ["rt*", "test_*", "teste_*"]
